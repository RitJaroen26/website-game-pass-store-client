<header
  class="fixed top-0 w-full z-50 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl shadow-[0_0_20px_rgba(0,242,255,0.1)]"
>
  <!-- ส่วน Navbar แนวนอน -->
  <div
    class="flex justify-between items-center h-20 px-4 md:px-8 max-w-[1280px] mx-auto w-full"
  >
    <!-- โลโก้ -->
    <div class="flex items-center">
      <span
        class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-400 font-headline-lg cursor-pointer"
        onclick="window.location.href = 'Homepage.html'"
      >
        GAMELORD
      </span>
    </div>

    <!-- เมนูตรงกลาง (แสดงเฉพาะจอใหญ่) -->
    <nav
      class="hidden md:flex items-center space-x-6 lg:space-x-8 font-['Space_Grotesk'] text-sm font-bold tracking-tight"
    >
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        onclick="window.location.href = 'Homepage.html'"
        >Marketplace</a
      >
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        onclick="window.location.href = 'RovAc.html'"
        >Sell Account</a
      >
      <a class="text-slate-400 hover:text-white transition-colors" href="#"
        >Boosting</a
      >
      <a class="text-slate-400 hover:text-white transition-colors" href="#"
        >Support</a
      >
    </nav>

    <!-- เมนูฝั่งขวา (กระเป๋าเงิน, โปรไฟล์, และปุ่มเมนูมือถือ) -->
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- แจ้งเตือน & กระเป๋าเงิน -->
      <div class="flex items-center gap-2 sm:gap-4">
        <button
          class="text-slate-400 hover:text-cyan-400 transition-colors p-1 md:p-0"
        >
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <div
          id="nav-wallet"
          class="hidden items-center gap-1 sm:gap-2 bg-slate-900 border border-cyan-400/30 px-2 sm:px-3 py-1.5 rounded-full cursor-pointer hover:bg-slate-800 hover:shadow-[0_0_10px_rgba(0,242,255,0.2)] transition-all"
          onclick="window.location.href = 'TopUp.html'"
        >
          <span
            class="material-symbols-outlined text-cyan-400 text-xs sm:text-sm"
            >account_balance_wallet</span
          >
          <span
            id="nav-balance"
            class="text-white text-xs sm:text-sm font-bold tracking-wider"
            >฿0.00</span
          >
        </div>
      </div>

      <!-- ส่วน Login / Profile -->
      <div id="auth-section" class="relative z-50">
        <!-- ปุ่มก่อน Login -->
        <button
          id="btn-nav-login"
          class="bg-gradient-to-r from-blue-600 to-cyan-400 px-4 sm:px-6 py-1.5 sm:py-2 rounded-lg text-sm sm:text-base font-bold text-white hover:opacity-90 active:scale-95 transition-all"
          onclick="window.location.href = 'Login.html'"
        >
          เข้าสู่ระบบ
        </button>

        <!-- โปรไฟล์หลัง Login (Dropdown) -->
        <div id="nav-profile" class="hidden relative group cursor-pointer">
          <div class="flex items-center gap-2 sm:gap-3">
            <div class="text-right hidden sm:block">
              <p id="nav-username" class="text-white text-sm font-bold">
                Player
              </p>
              <p class="text-tertiary text-xs">Member</p>
            </div>
            <div
              class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-[#0a0f1c] border-2 border-tertiary flex items-center justify-center overflow-hidden hover:shadow-[0_0_15px_rgba(0,242,255,0.4)] transition-all"
            >
              <span
                class="material-symbols-outlined text-tertiary text-[18px] sm:text-[24px]"
                >sports_esports</span
              >
            </div>
          </div>

          <div
            class="absolute right-0 top-full mt-2 w-56 bg-[#0a0f1c]/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden"
          >
            <div class="p-4 border-b border-slate-700/50 sm:hidden block">
              <p id="nav-username-mobile" class="text-white text-sm font-bold">
                Player
              </p>
              <p class="text-tertiary text-xs">Member</p>
            </div>
            <a
              href="profile.html"
              class="flex items-center gap-3 px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
            >
              <span class="material-symbols-outlined text-[20px]"
                >account_circle</span
              >โปรไฟล์ของฉัน
            </a>
            <a
              href="TopUp.html"
              class="flex items-center gap-3 px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
            >
              <span class="material-symbols-outlined text-[20px]"
                >account_balance_wallet</span
              >เติมเงิน
            </a>
            <div class="border-t border-slate-700/50"></div>
            <button
              id="btn-logout"
              class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-400 hover:bg-slate-800/50 hover:text-red-300 transition-colors text-left"
            >
              <span class="material-symbols-outlined text-[20px]">logout</span
              >ออกจากระบบ
            </button>
          </div>
        </div>
      </div>

      <!-- ปุ่ม Hamburger สำหรับเปิดเมนูในมือถือ -->
      <button
        id="mobile-menu-toggle"
        class="md:hidden text-slate-300 hover:text-cyan-400 transition-colors ml-1"
      >
        <span class="material-symbols-outlined text-3xl">menu</span>
      </button>
    </div>
  </div>

  <!-- แผงเมนูสำหรับมือถือ (Mobile Dropdown) ซ่อนไว้เป็นค่าเริ่มต้น -->
  <div
    id="mobile-menu-panel"
    class="md:hidden hidden bg-[#0a0f1c]/95 backdrop-blur-xl border-t border-white/10 overflow-hidden transition-all"
  >
    <nav
      class="flex flex-col font-['Space_Grotesk'] text-sm font-bold tracking-tight px-4 py-2"
    >
      <a
        href="#"
        class="text-slate-300 hover:text-cyan-400 hover:bg-white/5 py-4 border-b border-white/5 px-2 transition-colors"
        onclick="window.location.href = 'Homepage.html'"
        >Marketplace</a
      >
      <a
        href="#"
        class="text-slate-300 hover:text-cyan-400 hover:bg-white/5 py-4 border-b border-white/5 px-2 transition-colors"
        onclick="window.location.href = 'RovAc.html'"
        >Sell Account</a
      >
      <a
        href="#"
        class="text-slate-300 hover:text-cyan-400 hover:bg-white/5 py-4 border-b border-white/5 px-2 transition-colors"
        >Boosting</a
      >
      <a
        href="#"
        class="text-slate-300 hover:text-cyan-400 hover:bg-white/5 py-4 px-2 transition-colors"
        >Support</a
      >
    </nav>
  </div>
</header>
