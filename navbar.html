<header
  class="fixed top-0 w-full z-50 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl shadow-[0_0_20px_rgba(0,242,255,0.1)]"
>
  <div
    class="flex justify-between items-center h-20 px-8 max-w-[1280px] mx-auto w-full"
  >
    <div class="flex items-center gap-xs">
      <span
        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-400 font-headline-lg"
        style=""
        onclick="window.location.href = 'Homepage.html'"
        >GAMELORD</span
      >
    </div>
    <nav
      class="hidden md:flex items-center space-x-lg font-['Space_Grotesk'] text-sm font-bold tracking-tight"
    >
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        style=""
        onclick="window.location.href = 'Homepage.html'"
        >Marketplace</a
      >
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        style=""
        onclick="window.location.href = 'RovAc.html'"
        >Sell Account
      </a>
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        style=""
        >Boosting
      </a>
      <a
        class="text-slate-400 hover:text-white transition-colors"
        href="#"
        style=""
        >Support</a
      >
    </nav>
    <div class="flex items-center gap-md">
      <div class="flex items-center gap-sm">
        <button
          class="text-slate-400 hover:text-cyan-400 transition-colors"
          style=""
        >
          <span class="material-symbols-outlined" style="">notifications</span>
        </button>
        <div
          id="nav-wallet"
          class="hidden items-center gap-2 bg-slate-900 border border-cyan-400/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-slate-800 hover:shadow-[0_0_10px_rgba(0,242,255,0.2)] transition-all"
          onclick="window.location.href = 'TopUp.html'"
        >
          <span class="material-symbols-outlined text-cyan-400 text-sm"
            >account_balance_wallet</span
          >
          <span
            id="nav-balance"
            class="text-white text-sm font-bold tracking-wider"
            >฿0.00</span
          >
        </div>
      </div>
      <!-- <button
            class="bg-gradient-to-r from-blue-600 to-cyan-400 px-md py-xs rounded text-white font-label-bold hover:shadow-[0_0_15px_rgba(0,242,255,0.3)] transition-all duration-300 active:scale-95"
            onclick="window.location.href = 'login.html'"
          >
            Login
          </button> -->
      <div id="auth-section" class="relative z-50">
        <!-- ปุ่มสำหรับ "ก่อน Login" -->
        <button
          id="btn-nav-login"
          class="bg-gradient-to-r from-blue-600 to-cyan-400 px-6 py-2 rounded-lg font-bold text-white hover:opacity-90 active:scale-95 transition-all"
          onclick="window.location.href = 'Login.html'"
        >
          เข้าสู่ระบบ
        </button>

        <!-- ส่วนโปรไฟล์สำหรับ "หลัง Login" (ซ่อนไว้ก่อนโดยใส่คลาส hidden) -->
        <!-- ใช้คลาส group ของ Tailwind เพื่อทำ Dropdown แบบง่ายๆ -->
        <div id="nav-profile" class="hidden relative group cursor-pointer">
          <!-- รูปโปรไฟล์และชื่อ -->
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <!-- ส่วนแสดงชื่อผู้ใช้ -->
              <p id="nav-username" class="text-white text-sm font-bold">
                Player
              </p>
              <p class="text-tertiary text-xs">Member</p>
            </div>
            <!-- รูป Avatar พื้นฐาน -->
            <div
              class="w-10 h-10 rounded-full bg-[#0a0f1c] border-2 border-tertiary flex items-center justify-center overflow-hidden hover:shadow-[0_0_15px_rgba(0,242,255,0.4)] transition-all"
            >
              <span class="material-symbols-outlined text-tertiary"
                >sports_esports</span
              >
            </div>
          </div>

          <!-- เมนู Dropdown ย่อย (จะแสดงตอนเอาเมาส์ชี้) -->
          <div
            class="absolute right-0 top-full mt-2 w-56 bg-[#0a0f1c]/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden"
          >
            <div class="p-4 border-b border-slate-700/50 sm:hidden block">
              <!-- โชว์ชื่อในมือถือด้วย -->
              <p id="nav-username-mobile" class="text-white text-sm font-bold">
                Player
              </p>
            </div>

            <a
              href="profile.html"
              class="flex items-center gap-3 px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
            >
              <span class="material-symbols-outlined text-[20px]"
                >account_circle</span
              >
              โปรไฟล์ของฉัน
            </a>

            <a
              href="TopUp.html"
              class="flex items-center gap-3 px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
            >
              <span class="material-symbols-outlined text-[20px]"
                >account_balance_wallet</span
              >
              เติมเงิน
            </a>

            <div class="border-t border-slate-700/50"></div>

            <button
              id="btn-logout"
              class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-400 hover:bg-slate-800/50 hover:text-red-300 transition-colors text-left"
            >
              <span class="material-symbols-outlined text-[20px]">logout</span>
              ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
