<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <title>Random | ID</title>

    <style>
      /* 2. กำหนดให้ทั้งหน้าใช้ Font Kanit */
      body {
        font-family: "Kanit", sans-serif;
      }

      .cssbuttons-io-button {
        background: #2563eb;
        color: #ffffff;
        font-family: "Kanit", sans-serif; /* ใส่ Font ให้ปุ่มด้วย */
        padding: 0.35em;
        padding-left: 1.2em;
        font-size: 18px;
        font-weight: 600;
        border-radius: 0.9em;
        border: none;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        box-shadow: inset 0 0 1.6em -0.6em #ca8a04;
        overflow: hidden;
        position: relative;
        height: 2.8em;
        padding-right: 3.3em;
        cursor: pointer;
        transition: all 0.3s;
      }

      /* ... (CSS ส่วนเดิมของปุ่มคงไว้) ... */
      .cssbuttons-io-button .icon {
        background: #0f172a;
        margin-left: 1em;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 2.2em;
        width: 2.2em;
        border-radius: 0.7em;
        box-shadow: 0.1em 0.1em 0.6em 0.2em rgba(0, 0, 0, 0.3);
        right: 0.3em;
        transition: all 0.3s;
      }
      .cssbuttons-io-button:hover .icon {
        width: calc(100% - 0.6em);
      }
      .cssbuttons-io-button .icon svg {
        width: 1.1em;
        transition: transform 0.3s;
        color: #ffffff;
      }
      .cssbuttons-io-button:hover .icon svg {
        transform: translateX(0.1em);
      }
      .cssbuttons-io-button:active .icon {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body class="bg-[#0a0f16] text-white">
    <div class="flex flex-col justify-center items-center h-screen gap-6 px-4">
      <div
        class="border border-teal-500/50 bg-teal-900/20 text-teal-400 text-xs font-bold px-2 py-1 rounded tracking-widest uppercase"
      >
        Arena of Valor
      </div>

      <div class="text-center">
        <h1 class="text-6xl font-extrabold text-white mb-2">
          Welcome to Random | ID <span class="text-gray-300"></span>
        </h1>
        <p class="text-gray-400 text-lg max-w-xl"></p>
      </div>

      <button
        class="cssbuttons-io-button"
        onclick="window.location.href = 'Homepage.html'"
      >
        Get started
        <div class="icon">
          <svg
            height="24"
            width="24"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M0 0h24v24H0z" fill="none"></path>
            <path
              d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
              fill="currentColor"
            ></path>
          </svg>
        </div>
      </button>
    </div>
  </body>
</html>
